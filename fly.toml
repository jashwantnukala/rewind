# fly.toml — Fly.io app configuration for REWIND
# Generated for `fly launch` — edit the app name below.

app = "rewind-editor"          # change this to something unique (fly.io names are global)
primary_region = "sin"         # Singapore — closest to India; see `fly platform regions` for options

[build]
  # Uses the Dockerfile in the project root — no extra config needed.

[http_service]
  internal_port = 8080         # must match the PORT the binary listens on
  force_https   = true
  auto_stop_machines  = "stop" # free-tier: machine sleeps when idle
  auto_start_machines = true
  min_machines_running = 0     # 0 = fully serverless (free), 1 = always-on

[[vm]]
  size = "shared-cpu-1x"       # smallest (free) machine size

